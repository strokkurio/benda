name: PR title

# Pull requests are squash-merged with their title as the commit message, so the title is what release-please reads.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9-]+\))?!?: [^ ]'; then
            echo "::error::The PR title is not a Conventional Commit, e.g. 'feat(angular): ...', 'fix: ...' or 'feat!: ...'"
            exit 1
          fi
